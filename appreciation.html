<section id="assessment-intro" aria-label="杜牧的邀請" hidden><img src="assets/poet.png" alt="杜牧從秋山畫中走出，手持詩卷"><div class="assessment-message"><p class="speaker">杜牧</p><p>謝謝你幫我找回秋山的記憶。為了防止我再忘記，</p><p><strong>請留下你的發現，再運用今天學到的一種方法，寫出你對景物的喜愛。</strong></p><button id="begin-journal">留下回憶小記 →</button><button id="back-reading">返回朗讀</button></div></section><section id="spring-bridge" aria-label="下一段記憶：江南春" hidden><div class="spring-invitation"><p class="kicker">遠方，傳來一聲鶯啼……</p><h1>另一段記憶，正在甦醒</h1><p class="speaker">杜牧</p><p class="speech">「謝謝你留下的發現。咦，你聽見了嗎？<br>這聲鶯啼，讓我想起了江南的春天……」</p><p>下一段旅程 ·《江南春》</p><button id="replay-birds">再聽鶯啼</button><button id="return-journal">返回回憶小記</button><p id="bird-status" role="status"></p></div></section><div class="teacher-side"><section id="discussion" aria-label="杜牧的提問"><p class="kicker" id="chapter"></p><h1 id="heading" tabindex="-1"></h1><p class="speaker">杜牧</p><p id="question" class="speech"></p><div id="activities" class="activities"></div><div class="support-actions"><button id="hint-toggle" aria-expanded="false" aria-controls="hint">顯示提示</button><button id="summary-toggle" aria-expanded="false" aria-controls="summary">顯示小結</button></div><p id="hint" class="support" hidden></p><p id="summary" class="support summary" hidden></p><div class="step-controls"><button id="previous">← 上一步</button><button id="next" class="primary">沿徑望去 →</button></div></section><button id="collapse" aria-expanded="true" aria-controls="discussion">收起任務 ▾</button></div>
