<main id="main"><section id="landscape" aria-label="可移動觀看的水彩秋山"><div id="world"></div><div class="scene-top"><span>第一章・秋山歸憶</span><span id="progress"></span><span id="score-badge" role="status" aria-live="polite" hidden></span></div><div id="intro-art" hidden><div class="book-aura" aria-hidden="true"></div><div class="storybook" role="img" aria-label="一本緩緩翻開的古詩課本，左頁寫着山行，右頁寫着江南春"><div class="book-base"></div><div class="book-page page-left"><span class="page-heading">山行</span><span class="page-verses">遠上寒山石徑斜<br>白雲生處有人家<br>停車坐愛楓林晚<br>霜葉紅於二月花</span></div><div class="book-page page-right"><span class="page-heading">江南春</span><span class="page-verses">千里鶯啼綠映紅<br>水村山郭酒旗風<br>南朝四百八十寺<br>多少樓臺煙雨中</span></div><div class="book-turn turn-one" aria-hidden="true"></div><div class="book-turn turn-two" aria-hidden="true"></div><div class="book-cover" aria-hidden="true"><span>古詩</span><small>入畫 · 尋憶</small></div><div class="book-spine" aria-hidden="true"></div></div><img id="visitor" alt="一位身穿古裝的陌生男子從書中浮現"><p class="opening-caption" role="status">書頁翻動，一段往事正在甦醒……</p></div><div id="home"><p class="kicker">一場走進古詩的旅程</p><h1>入畫</h1><h2>尋回古人的記憶</h2><p>一位忘記過去的詩人，<br>兩張褪去景色的詩箋……<br>請幫他找回自己的記憶。</p><button id="start" class="primary">翻開故事 <span aria-hidden="true">→</span></button></div><div class="scene-bottom"><p id="scene-status" role="status" hidden>秋山正在浮現……</p><div id="views"><button id="scene-replay" hidden>再看景物</button><button data-view="poet">看杜牧</button><button data-view="wide">看全景</button><button data-view="angle">換個角度</button><button data-zoom="0.8" aria-label="放大景物">＋</button><button data-zoom="1.25" aria-label="縮小景物">−</button></div><small>拖曳看景・雙指縮放</small></div></section><aside id="reveal-banner" aria-label="新景物出現" hidden><p id="reveal-title" role="status"></p><p id="reveal-detail"></p><p id="reveal-quote"></p><button id="reveal-continue" type="button">看到了，繼續</button></aside><section id="panel" aria-label="故事與尋憶任務" hidden></section><button id="task-toggle" class="task-toggle" type="button" aria-controls="panel" aria-expanded="true" hidden>收起任務 ▾</button></main>
